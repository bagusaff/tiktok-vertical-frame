<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>norther - start / ending screen (1080x1920)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap">
<style>
:root{--bg:#15131D;--panel:#1C1928;--slot:#000000;--ink:#F3EBD8;--dim:#B9B1C9;--accent:#C9B8FF;--shadow:#0B0A10;--name-shadow:0 0 22px rgba(201,184,255,.45);--txt-shadow:none}
body.t-night{--bg:#120B2E;--panel:#150D33;--ink:#F3EBFF;--dim:#C6BAE8;--accent:#C59BFF;--shadow:#07041A;--name-shadow:6px 6px 0 #07041A;--txt-shadow:3px 3px 0 #07041A}
body.t-dusk{--bg:#141230;--panel:#1A1430;--ink:#FFF1DE;--dim:#DCC3CF;--accent:#FFC27A;--shadow:#0A0818;--name-shadow:6px 6px 0 #0A0818;--txt-shadow:3px 3px 0 #0A0818}
body.t-blue{--bg:#0A1230;--panel:#0C1433;--ink:#EAF3FF;--dim:#B5C6E8;--accent:#7FC4FF;--shadow:#040818;--name-shadow:6px 6px 0 #040818;--txt-shadow:3px 3px 0 #040818}
body.t-green{--bg:#071A14;--panel:#091D17;--ink:#ECFFF2;--dim:#B4D9C2;--accent:#7EE8A2;--shadow:#030D0A;--name-shadow:6px 6px 0 #030D0A;--txt-shadow:3px 3px 0 #030D0A}
body.t-mono{--bg:#0A0A0A;--panel:#111111;--ink:#F5F5F5;--dim:#C4C4C4;--accent:#FFFFFF;--shadow:#000000;--name-shadow:6px 6px 0 #000000;--txt-shadow:3px 3px 0 #000000}
body.t-blossom{--bg:#2B1028;--panel:#24102A;--ink:#FFF0F6;--dim:#E6C3D6;--accent:#FF9CC7;--shadow:#12060F;--name-shadow:6px 6px 0 #12060F;--txt-shadow:3px 3px 0 #12060F}
body.t-sky{--bg:#BFE6FF;--panel:#F4FBFF;--ink:#12304F;--dim:#2F5878;--accent:#1B5FC4;--shadow:#7DB7E0;--name-shadow:6px 6px 0 #EAF7FF;--txt-shadow:3px 3px 0 #EAF7FF}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#frame{position:absolute;left:0;top:0;transform-origin:0 0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Pixelify Sans',ui-monospace,monospace}
#sky{position:absolute;left:0;top:0;width:1080px;height:1920px;image-rendering:pixelated;display:none}
body.pix #sky{display:block}
body.pix .crt-only{display:none}
.glow{position:absolute;left:0;top:0;width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 35%,#322C4E 0%,rgba(21,19,29,0) 60%)}
.scan{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;pointer-events:none;background-image:repeating-linear-gradient(to bottom,rgba(0,0,0,.3) 0 2px,rgba(0,0,0,0) 2px 6px)}
.roll{position:absolute;left:0;top:0;width:1080px;height:300px;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.05),rgba(255,255,255,0));animation:roll 9s linear infinite}
.mid{position:absolute;left:64px;right:64px;top:400px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;text-shadow:var(--txt-shadow)}
.row{display:flex;align-items:center;gap:28px}
.tag{padding:2px 16px;background:var(--accent);color:var(--bg);font-size:32px;font-weight:700;text-shadow:none}
.pads{display:flex;gap:24px;color:var(--accent)}
.life{display:block;width:88px;height:48px;animation:beat 1.6s steps(2) infinite}
.pad{width:8px;height:8px;box-shadow:8px 0px currentColor,16px 0px currentColor,24px 0px currentColor,32px 0px currentColor,40px 0px currentColor,48px 0px currentColor,56px 0px currentColor,64px 0px currentColor,72px 0px currentColor,0px 8px currentColor,8px 8px currentColor,16px 8px currentColor,32px 8px currentColor,40px 8px currentColor,48px 8px currentColor,56px 8px currentColor,64px 8px currentColor,72px 8px currentColor,80px 8px currentColor,0px 16px currentColor,8px 16px currentColor,40px 16px currentColor,48px 16px currentColor,64px 16px currentColor,80px 16px currentColor,0px 24px currentColor,8px 24px currentColor,16px 24px currentColor,32px 24px currentColor,40px 24px currentColor,48px 24px currentColor,56px 24px currentColor,64px 24px currentColor,72px 24px currentColor,80px 24px currentColor,0px 32px currentColor,8px 32px currentColor,16px 32px currentColor,24px 32px currentColor,56px 32px currentColor,64px 32px currentColor,72px 32px currentColor,80px 32px currentColor,8px 40px currentColor,16px 40px currentColor,64px 40px currentColor,72px 40px currentColor}
.pad{display:block}
.stage{font-size:40px;font-weight:500;letter-spacing:6px;color:var(--dim)}
.name{display:flex;align-items:baseline;gap:12px;font-size:150px;font-weight:700;line-height:1;text-shadow:var(--name-shadow)}
.cursor{color:var(--accent);animation:blink 1.1s steps(1) infinite}
.big{font-size:72px;font-weight:700;letter-spacing:4px;color:var(--accent);text-shadow:var(--name-shadow)}
.big.blink{animation:blink 1.4s steps(1) infinite}
.sub{font-size:44px;font-weight:500;letter-spacing:3px;color:var(--ink)}
.box{position:relative;align-self:stretch;margin-top:22px;box-sizing:border-box;min-height:150px;padding:26px 32px 30px 32px;border:4px solid var(--ink);background:var(--panel);box-shadow:8px 8px 0 var(--shadow);font-size:42px;font-weight:500;line-height:1.25;text-align:left;text-shadow:none}
.arrow{position:absolute;right:24px;bottom:16px;width:0;height:0;border-left:12px solid rgba(0,0,0,0);border-right:12px solid rgba(0,0,0,0);border-top:16px solid var(--accent);animation:bob 1s steps(2) infinite}
@keyframes blink{0%,59%{opacity:1}60%,100%{opacity:0}}
@keyframes roll{from{transform:translateY(-300px)}to{transform:translateY(1920px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
</style>
</head>
<body>
<div id="frame">
<canvas id="sky" width="135" height="240"></canvas>
<div class="glow crt-only"></div>
<div class="mid">
<div class="row"><div class="tag">1P</div><div class="pads"><span class="life"><span class="pad"></span></span><span class="life"><span class="pad"></span></span><span class="life"><span class="pad"></span></span></div></div>
<div class="stage" id="stage">STAGE 01</div>
<div class="name"><span id="name">NORTHER</span><span class="cursor">_</span></div>
<div class="big" id="big">PRESS START</div>
<div class="sub" id="sub"></div>
<div class="box" id="box" style="display:none"><div id="line"></div><div class="arrow"></div></div>
</div>
<div class="scan crt-only"><div class="roll"></div></div>
</div>
<script>
// URL parameters:
//   mode=start|end      which screen to show (default start)
//   theme=1..8          crt, night, dusk, blue, green, mono, blossom, sky
//   stage=02  name=NORTHER  accent=9FE8A6
//   mins=5              start screen only: counts down "STARTS IN 05:00"
//   line=...            optional text shown in a dialogue box
var q = new URLSearchParams(location.search);
var THEMES = {'1':'crt','2':'night','3':'dusk','4':'blue','5':'green','6':'mono','7':'blossom','8':'sky',sky:'sky',lightblue:'sky',blossom:'blossom',pink:'blossom',crt:'crt',night:'night',dusk:'dusk',blue:'blue',green:'green',mono:'mono',bw:'mono'};
var theme = THEMES[(q.get('theme') || '1').toLowerCase()] || 'crt';
document.body.className = 't-' + theme + (theme === 'crt' ? '' : ' pix');
var mode = (q.get('mode') || 'start').toLowerCase() === 'end' ? 'end' : 'start';
var stage = q.get('stage') || '01';
if (q.get('name')) document.getElementById('name').textContent = q.get('name');
if (/^[0-9a-fA-F]{6}$/.test(q.get('accent') || '')) document.body.style.setProperty('--accent', '#' + q.get('accent'));
var big = document.getElementById('big'), sub = document.getElementById('sub');
if (mode === 'start') {
  document.getElementById('stage').textContent = 'STAGE ' + stage;
  big.textContent = 'PRESS START'; big.className = 'big blink';
  var mins = parseFloat(q.get('mins'));
  if (mins > 0) {
    var endAt = Date.now() + mins * 60000;
    var tick = function(){var s=Math.max(0,Math.round((endAt-Date.now())/1000));sub.textContent='STARTS IN '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
    tick(); setInterval(tick, 500);
  }
} else {
  document.getElementById('stage').textContent = 'STAGE ' + stage + ' CLEAR';
  big.textContent = 'THANKS FOR PLAYING';
  sub.textContent = 'TO BE CONTINUED';
}
if (q.get('line')) { document.getElementById('line').textContent = q.get('line'); document.getElementById('box').style.display = 'block'; }

// Scale the 1080x1920 screen to whatever window size the streaming app gives it
function fit(){var f=document.getElementById('frame');var k=Math.min(window.innerWidth/1080,window.innerHeight/1920);f.style.transform='scale('+k+')';f.style.left=((window.innerWidth-1080*k)/2)+'px';f.style.top=((window.innerHeight-1920*k)/2)+'px';}
window.addEventListener('resize',fit);fit();

// Full-height pixel scenes (135x240, scaled 8x), one per theme
var SKIES = {
night:{scene:'night',sky:['#120B2E','#1A1040','#241655','#2E1C6B','#3A2382'],star:'#E9DDFF',moon:['#EBD9FF','#C9B0F5'],back:'#3B2A7A',front:'#5A3FB0',rim:'#7E5FD6'},
dusk:{scene:'sunset',sky:['#141230','#23194A','#3B2260','#5E2B6B','#8A3A6A'],star:'#FFE9C9',sun:['#FFD9A0','#F0A060'],back:'#6E3766',sea:'#1A1438',glow:'#E0785A',shim:'#6B3A70',refl:'#9A4A66'},
blue:{scene:'sea',sky:['#1C4C9E','#173F88','#123372','#0E285C','#0A1D48'],star:'#E3F0FF',ray:'#BFE0FF',bub:'#7FC4FF',fish:'#FFB86B',back:'#1E6E8C',front:'#2FA39A'},
green:{scene:'forest',sky:['#06140F','#081C16','#0B261D','#0E3025','#123B2E'],star:'#E6FFE9',back:'#1A4D3D',front:'#0C2E24',fly:['#F2FF9A','#8FBF4A']},
mono:{scene:'snow',sky:['#0A0A0A','#141414','#1E1E1E','#282828','#333333'],star:'#FFFFFF',flake:'#9A9A9A',moon:['#F5F5F5','#BDBDBD'],back:'#3A3A3A',front:'#555555',cap:'#9A9A9A'},
sky:{scene:'day',sky:['#8FD0FF','#A3D9FF','#B7E2FF','#CBEBFF','#DDF3FF'],sun:['#FFD95A','#FFF0A8'],back:'#E3F3FF',front:'#FFFFFF',bird:'#2F5878'},
blossom:{scene:'blossom',sky:['#2B1028','#3A1634','#4D1D42','#632650','#7A305E'],star:'#FFE3F0',pet:['#FFC2DD','#FF8FBF'],core:'#FFE9A8',branch:'#7A4250',back:'#5A2249'}
};
function startSky(p){
p.bh=40;
var c=document.getElementById('sky'),x=c.getContext('2d'),W=135,H=240,seed=7,t=0;
function r(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function ri(a,b){return Math.floor(a+r()*(b-a+1));}
function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),w,h);}
function disc(cx,cy,rad,col){x.fillStyle=col;cx=Math.round(cx);cy=Math.round(cy);for(var dy=-rad;dy<=rad;dy++){var w=Math.floor(Math.sqrt(rad*rad-dy*dy));x.fillRect(cx-w,cy+dy,2*w+1,1);}}
function sky(){var n=p.sky.length,BH=p.bh||16,y,xx;for(y=0;y<H;y++){var b=Math.min(n-1,Math.floor(y/BH));rect(0,y,W,1,p.sky[b]);var e=y%BH;if(b<n-1&&e>=BH-2){x.fillStyle=p.sky[b+1];var step=(e===BH-2)?4:2;for(xx=(y%2);xx<W;xx+=step)x.fillRect(xx,y,1,1);}}}
function mkStars(n,maxY){var a=[];for(var i=0;i<n;i++)a.push([ri(0,W-1),ri(0,maxY),ri(0,23)]);return a;}
function drawStars(a,big){x.fillStyle=p.star;for(var k=0;k<a.length;k++){var s=a[k];if((t+s[2])%24<19){x.fillRect(s[0],s[1],1,1);if(k<big){x.fillRect(s[0]-1,s[1],3,1);x.fillRect(s[0],s[1]-1,1,3);}}}}
function mkBumps(n,rmin,rmax){var a=[];for(var j=0;j<n;j++)a.push([r()*270,ri(rmin,rmax)]);return a;}
function drawBumps(L){for(var j=0;j<L.b.length;j++){var cx=(((L.b[j][0]-t*L.sp)%270)+270)%270-67,rad=L.b[j][1],cy=L.base-Math.round(rad*0.4);if(L.rim)disc(cx,cy-1,rad,L.rim);disc(cx,cy,rad,L.col);}}
function moon(){disc(112,13,9,p.moon[0]);x.fillStyle=p.moon[1];x.fillRect(108,10,2,2);x.fillRect(114,15,3,2);x.fillRect(110,18,2,1);}
function moonBig(){disc(102,36,14,p.moon[0]);x.fillStyle=p.moon[1];x.fillRect(96,31,3,3);x.fillRect(105,39,4,3);x.fillRect(99,44,3,2);}
function drawBirds(birds,col){x.fillStyle=col;for(var i=0;i<birds.length;i++){var b=birds[i],bx=Math.round((b[0]+t*b[2])%(W+10))-5,by=b[1];if(((t>>2)+i)%2){x.fillRect(bx-1,by-1,1,1);x.fillRect(bx,by,1,1);x.fillRect(bx+1,by-1,1,1);}else{x.fillRect(bx-1,by,3,1);}}}
var SC={
night:function(){var st=mkStars(120,H-1),L=[{b:mkBumps(12,14,24),base:246,sp:0.08,col:p.back},{b:mkBumps(11,9,16),base:250,sp:0.18,col:p.front,rim:p.rim}];
return function(){drawStars(st,10);moonBig();L.forEach(drawBumps);};},
sunset:function(){p.bh=34;var st=mkStars(40,70),dash=[],i,HZ=168,R=24;for(i=0;i<60;i++)dash.push([ri(0,W-5),ri(HZ+3,H-1),ri(2,6),ri(0,15)]);
var streak=[[10,30,26],[70,48,18],[30,140,30],[90,152,20]],birds=[[0,60,0.35],[40,72,0.28],[85,52,0.4]];
function stripe(dy,col){var w=Math.floor(Math.sqrt(R*R-dy*dy));rect(67-w,HZ+dy,2*w+1,1,col);}
return function(){drawStars(st,4);
for(i=0;i<streak.length;i++){var sx=((streak[i][0]+t*0.04)%(W+30))-30;rect(sx,streak[i][1],streak[i][2],1,p.back);rect(sx+3,streak[i][1]+1,streak[i][2]-8,1,p.back);}
disc(67,HZ,R,p.sun[0]);stripe(-3,p.sun[1]);stripe(-7,p.sun[1]);stripe(-11,p.sun[1]);stripe(-15,p.sun[1]);
rect(0,HZ,W,H-HZ,p.sea);rect(0,HZ,W,1,p.glow);
for(var y=HZ+2;y<HZ+26;y+=2){var w=Math.max(1,22-(y-HZ)),o=((t>>2)+y)%3-1;rect(67-w+o,y,2*w,1,p.refl);}
for(i=0;i<dash.length;i++){var d=dash[i];if((t+d[3])%16<8)rect(d[0],d[1],d[2],1,p.shim);}
drawBirds(birds,p.star);
};},
sea:function(){p.bh=48;var bub=[],weed=[],i;for(i=0;i<26;i++)bub.push([ri(2,W-3),ri(0,H-1),0.3+r()*0.5,ri(1,2)]);
for(i=0;i<18;i++)weed.push([ri(2,W-3),ri(14,34),r()*6]);
var fish=[[0,30,0.45],[60,150,0.3],[110,205,0.38]];
return function(){
x.globalAlpha=0.10+0.03*Math.sin(t/10);x.fillStyle=p.ray;for(i=0;i<3;i++){var rx=10+i*40;for(var y=0;y<170;y++)x.fillRect(Math.round(rx+y*0.35),y,12-i*2,1);}x.globalAlpha=1;
for(i=0;i<weed.length;i++){var wd=weed[i],hh=wd[1];for(var j=0;j<hh;j++){var ox=Math.round(Math.sin(t/7+wd[2]+j/4)*(j/hh)*3);rect(wd[0]+ox,240-j,2,1,i%3?p.back:p.front);}}
for(i=0;i<fish.length;i++){var f=fish[i],fx=Math.round((f[0]+t*f[2])%(W+24))-12,fy=f[1];x.fillStyle=p.fish;x.fillRect(fx-1,fy-1,4,3);x.fillRect(fx+3,fy,1,1);x.fillRect(fx-2,fy,1,1);x.fillRect(fx-3,fy-1,1,3);rect(fx+2,fy-1,1,1,p.sky[4]);}
for(i=0;i<bub.length;i++){var b=bub[i],by=H-((t*b[2]+b[1])%H),bx=b[0]+(((t>>3)+i)%2);if(b[3]===1)rect(bx,by,1,1,p.star);else{rect(bx,by,2,2,p.bub);rect(bx,by,1,1,p.star);}}
};},
forest:function(){var st=mkStars(60,120),far=[],near=[],fl=[],i;
function mkTrees(a,base,step,hmin,hmax){for(var cx=-2;cx<W+4;cx+=step+ri(-2,2))a.push([cx,base,ri(hmin,hmax)]);}
mkTrees(far,242,8,34,56);mkTrees(near,243,13,18,36);
for(i=0;i<34;i++)fl.push([ri(3,W-4),ri(60,236),r()*6.28,ri(0,19)]);
function tree(tr,col){for(var j=0;j<tr[2];j++){var w=Math.floor((j%5)*0.7+j/4);rect(tr[0]-w,tr[1]-tr[2]+j,2*w+1,1,col);}}
return function(){drawStars(st,5);
for(i=0;i<far.length;i++)tree(far[i],p.back);for(i=0;i<near.length;i++)tree(near[i],p.front);
for(i=0;i<fl.length;i++){var f=fl[i],fx=Math.round(f[0]+3*Math.sin(t/9+f[2])),fy=Math.round(f[1]+2*Math.cos(t/7+f[2])),ph=(t+f[3])%20;if(ph<12){if(ph>3&&ph<9){rect(fx-1,fy,3,1,p.fly[1]);rect(fx,fy-1,1,3,p.fly[1]);}rect(fx,fy,1,1,p.fly[0]);}}
};},
snow:function(){var st=mkStars(60,120),fl=[],i;
function range(base,n,hmin,hmax,slope){var pk=[],a=[],xx,k;for(k=0;k<n;k++)pk.push([ri(0,W),ri(hmin,hmax)]);for(xx=0;xx<W;xx++){var h=2,top=999;for(k=0;k<n;k++){var v=pk[k][1]-Math.abs(xx-pk[k][0])*slope;if(v>h){h=v;top=pk[k][1];}}a.push([Math.round(h),top]);}return {a:a,base:base};}
var R=[range(242,6,50,80,1.0),range(243,5,24,44,0.8)];
for(i=0;i<85;i++)fl.push([ri(0,W-1),ri(0,H-1),0.35+r()*0.6,r()*6.28,i%3]);
function drawRange(g,col,cap){for(var xx=0;xx<W;xx++){var h=g.a[xx][0];rect(xx,g.base-h,1,h,col);if(cap&&h>g.a[xx][1]-7)rect(xx,g.base-h,1,3,p.cap);}}
return function(){drawStars(st,5);moonBig();drawRange(R[0],p.back,1);drawRange(R[1],p.front,0);
for(i=0;i<fl.length;i++){var f=fl[i];rect((f[0]+Math.sin(t/8+f[3])*2+W)%W,(f[1]+t*f[2])%H,1,1,f[4]?p.star:p.flake);}
};},
day:function(){var L=[{b:mkBumps(12,14,24),base:247,sp:0.07,col:p.back},{b:mkBumps(11,9,16),base:251,sp:0.14,col:p.front}],fc=[[10,22,5,0.05],[70,60,4,0.08],[40,120,5,0.06],[100,150,4,0.07],[20,172,6,0.04],[85,95,3,0.09]],birds=[[20,50,0.3],[75,140,0.26]],i;
return function(){disc(104,34,13,p.sun[0]);disc(104,34,9,p.sun[1]);
for(i=0;i<fc.length;i++){var f=fc[i],cx=((f[0]+t*f[3])%(W+30))-15,sz=f[2];disc(cx-sz,f[1]+1,sz-1,p.front);disc(cx+sz,f[1]+1,sz-1,p.front);disc(cx,f[1],sz,p.front);rect(cx-2*sz+1,f[1]+2,4*sz-1,sz-1,p.front);}
L.forEach(drawBumps);drawBirds(birds,p.bird);
};},
blossom:function(){var pet=[],i,L=[{b:mkBumps(9,16,26),base:258,sp:0,col:p.back}],st=mkStars(20,80);
for(i=0;i<55;i++)pet.push([ri(0,W-1),ri(0,H-1),0.3+r()*0.45,r()*6.28,i%2]);
function line(x0,y0,x1,y1,col){var n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));for(var k=0;k<=n;k++)rect(x0+(x1-x0)*k/n,y0+(y1-y0)*k/n,2,2,col);}
var bl=[[128,3,3],[120,7,2],[109,9,3],[98,8,2],[88,14,3],[106,16,2],[99,19,3],[116,12,2]];
return function(){drawStars(st,2);L.forEach(drawBumps);
x.setTransform(2,0,0,2,-135,0);
line(135,1,112,9,p.branch);line(112,9,98,8,p.branch);line(98,8,87,14,p.branch);line(112,9,105,16,p.branch);line(105,16,99,19,p.branch);
for(i=0;i<bl.length;i++){disc(bl[i][0],bl[i][1],bl[i][2],i%2?p.pet[0]:p.pet[1]);rect(bl[i][0],bl[i][1],1,1,p.core);}
x.setTransform(1,0,0,1,0,0);
