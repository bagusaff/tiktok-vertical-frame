<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>norther - CRT stream frame (1080x1920)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap">
<style>
:root{--accent:#C9B8FF}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15131D}
@keyframes cr-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes cr-roll{from{transform:translateY(-240px)}to{transform:translateY(900px)}}
@keyframes cr-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes cr-beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.cr-cursor{animation:cr-blink 1.1s steps(1) infinite}
.cr-roll{animation:cr-roll 9s linear infinite}
.cr-arrow{animation:cr-bob 1s steps(2) infinite}
.cr-life{animation:cr-beat 1.6s steps(2) infinite}
@keyframes cr-turn{0%,40%{transform:rotate(0deg)}50%,90%{transform:rotate(90deg)}100%{transform:rotate(0deg)}}
.cr-turn{animation:cr-turn 3s steps(1) infinite}
.cr-pad{width:8px;height:8px;box-shadow:8px 0px currentColor,16px 0px currentColor,24px 0px currentColor,32px 0px currentColor,40px 0px currentColor,48px 0px currentColor,56px 0px currentColor,64px 0px currentColor,72px 0px currentColor,0px 8px currentColor,8px 8px currentColor,16px 8px currentColor,32px 8px currentColor,40px 8px currentColor,48px 8px currentColor,56px 8px currentColor,64px 8px currentColor,72px 8px currentColor,80px 8px currentColor,0px 16px currentColor,8px 16px currentColor,40px 16px currentColor,48px 16px currentColor,64px 16px currentColor,80px 16px currentColor,0px 24px currentColor,8px 24px currentColor,16px 24px currentColor,32px 24px currentColor,40px 24px currentColor,48px 24px currentColor,56px 24px currentColor,64px 24px currentColor,72px 24px currentColor,80px 24px currentColor,0px 32px currentColor,8px 32px currentColor,16px 32px currentColor,24px 32px currentColor,56px 32px currentColor,64px 32px currentColor,72px 32px currentColor,80px 32px currentColor,8px 40px currentColor,16px 40px currentColor,64px 40px currentColor,72px 40px currentColor}
@media (prefers-reduced-motion: reduce){.cr-cursor,.cr-roll,.cr-arrow,.cr-life,.cr-turn{animation:none}}
</style>
</head>
<body>
<div id="frame" style="position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 1080px; height: 1920px; overflow: hidden; background: #15131D; color: #F3EBD8; font-family: 'Pixelify Sans', ui-monospace, monospace">

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: radial-gradient(ellipse at 50% 12%, #2A2540 0%, rgba(21,19,29,0) 55%), radial-gradient(ellipse at 50% 80%, #241F36 0%, rgba(21,19,29,0) 60%)"></div>

<div style="position: absolute; left: 64px; right: 64px; top: 198px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 28px">
<div style="padding: 2px 16px; background: var(--accent); color: #15131D; font-size: 32px; font-weight: 700">1P</div>
<div aria-hidden="true" style="display: flex; gap: 24px; color: var(--accent)">
<span class="cr-life" style="display: block; width: 88px; height: 48px"><span class="cr-pad" style="display: block"></span></span>
<span class="cr-life" style="display: block; width: 88px; height: 48px"><span class="cr-pad" style="display: block"></span></span>
<span class="cr-life" style="display: block; width: 88px; height: 48px"><span class="cr-pad" style="display: block"></span></span>
</div>
</div>
<div style="font-size: 34px; font-weight: 500; letter-spacing: 2px; color: #B9B1C9" id="stage">STAGE 01</div>
</div>
<div style="display: flex; align-items: baseline; gap: 10px; font-size: 92px; font-weight: 700; line-height: 1; color: #F3EBD8; text-shadow: 0 0 22px rgba(201,184,255,0.45)">
<span>NORTHER</span><span class="cr-cursor" aria-hidden="true" style="color: var(--accent)">_</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 24px; font-size: 32px; font-weight: 500; letter-spacing: 1px">
<div style="display: flex; align-items: baseline; gap: 14px">
<span style="color: #B9B1C9">NOW PLAYING</span><span style="font-weight: 700; color: #F3EBD8" id="game">GTA VI</span>
</div>
<div style="display: flex; align-items: center; gap: 16px; color: #B9B1C9">
<span class="cr-turn" aria-hidden="true" style="display: block; width: 20px; height: 32px; box-sizing: border-box; border: 4px solid var(--accent)"></span>
<span>ROTATE = FULLSCREEN</span>
</div>
</div>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1080px; height: 440px; pointer-events: none; background-image: repeating-linear-gradient(to bottom, rgba(0,0,0,0.3) 0 2px, rgba(0,0,0,0) 2px 6px)"></div>

<div style="position: absolute; left: 0; top: 440px; width: 1080px; height: 608px; background: #000000"></div>
<div style="position: absolute; left: 0; top: 436px; width: 1080px; height: 4px; background: #F3EBD8"></div>
<div style="position: absolute; left: 0; top: 1048px; width: 1080px; height: 4px; background: #F3EBD8"></div>

<div style="position: absolute; left: 48px; right: 48px; top: 1090px; box-sizing: border-box; min-height: 168px; padding: 26px 32px 30px 32px; border: 4px solid #F3EBD8; background: #1C1928; box-shadow: 8px 8px 0 #0B0A10">
<div style="font-size: 42px; font-weight: 500; line-height: 1.25; color: #F3EBD8" id="line"></div>
<div class="cr-arrow" aria-hidden="true" style="position: absolute; right: 24px; bottom: 16px; width: 0; height: 0; border-left: 12px solid rgba(0,0,0,0); border-right: 12px solid rgba(0,0,0,0); border-top: 16px solid var(--accent)"></div>
</div>

<div style="position: absolute; left: 48px; right: 48px; top: 1296px; height: 576px; display: flex; gap: 24px">
<div style="flex: 1 1 0; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; border: 4px solid #F3EBD8; background: #1C1928; box-shadow: 8px 8px 0 #0B0A10">
<div style="padding: 4px 20px; background: #F3EBD8; color: #15131D; font-size: 30px; font-weight: 700; letter-spacing: 2px">CHAT</div>
<div style="display: flex; flex-direction: column; gap: 18px; padding: 22px 20px; font-size: 32px; font-weight: 500; color: #B9B1C9">
</div>
</div>
<div style="flex: none; width: 380px; box-sizing: border-box; display: flex; flex-direction: column; border: 4px solid #F3EBD8; background: #1C1928; box-shadow: 8px 8px 0 #0B0A10">
<div style="padding: 4px 20px; background: #F3EBD8; color: #15131D; font-size: 30px; font-weight: 700; letter-spacing: 2px">TOP LIKES</div>
<div style="display: flex; flex-direction: column; gap: 18px; padding: 22px 20px; font-size: 32px; font-weight: 500; color: #B9B1C9">
</div>
</div>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; top: 1048px; width: 1080px; height: 872px; overflow: hidden; pointer-events: none">
<div style="position: absolute; left: 0; top: 0; width: 1080px; height: 872px; background-image: repeating-linear-gradient(to bottom, rgba(0,0,0,0.3) 0 2px, rgba(0,0,0,0) 2px 6px)"></div>
<div class="cr-roll" style="position: absolute; left: 0; top: 0; width: 1080px; height: 240px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.05), rgba(255,255,255,0))"></div>
</div>

</div>
<script>
// Scale the 1080x1920 frame to whatever window size the streaming app gives it
function fit(){var f=document.getElementById('frame');var k=Math.min(window.innerWidth/1080,window.innerHeight/1920);f.style.transform='scale('+k+')';f.style.left=((window.innerWidth-1080*k)/2)+'px';f.style.top=((window.innerHeight-1920*k)/2)+'px';}
window.addEventListener('resize',fit);fit();
// Edit text without touching the file: add ?stage=02&game=GTA%20VI&line=hello&accent=9FE8A6 to the URL
var q = new URLSearchParams(location.search);
if (q.get('stage')) document.getElementById('stage').textContent = 'STAGE ' + q.get('stage');
if (q.get('game')) document.getElementById('game').textContent = q.get('game');
document.getElementById('line').textContent = q.get('line') || '';
if (/^[0-9a-fA-F]{6}$/.test(q.get('accent') || '')) document.documentElement.style.setProperty('--accent', '#' + q.get('accent'));
</script>
</body>
</html>
